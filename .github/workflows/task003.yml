
name: Build app

on:
  - pull_request

jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1
        run: echo "Step 1"
      - name: Step 2
        run: echo "Step 2"

  job2:
    runs-on: ubuntu-latest

    needs: job1

    steps:
      - name: Step 1
        run: echo "Step 1"
      - name: Step 2
        run: echo "Step 2"

  post-comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    needs: [job1, job2]
    steps:
      - name: Post comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            All jobs have finished! 🎉